<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c306b" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c306b"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="crowFoot" viewBox="0 0 20 20" refX="15" refY="10" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 15 10 L 0 20 M 15 0 L 15 20" fill="none" stroke="#475569" stroke-width="2"/>
    </marker>
    <marker id="oneOnly" viewBox="0 0 20 20" refX="5" refY="10" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 5 0 L 5 20 M 10 0 L 10 20" fill="none" stroke="#475569" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1120" height="70" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">ENTITY RELATIONSHIP DIAGRAM (ERD)</text>
  <text x="600" y="78" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="500">CENTRAL APPLICATION MAINTENANCE &amp; LIFECYCLE ORCHESTRATOR — SSO KPKNL PALEMBANG</text>

  <!-- TABLE 1: APPLICATIONS (Master) -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="320" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="url(#headerGrad)"/>
    <rect y="32" width="320" height="8" fill="#0c306b"/>
    <text x="160" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">APPLICATIONS</text>
    <text x="15" y="60" fill="#0f172a" font-size="12"><tspan fill="#d97706" font-weight="700">PK</tspan>  id : bigint unsigned</text>
    <text x="15" y="82" fill="#334155" font-size="12">    name : varchar(255)</text>
    <text x="15" y="104" fill="#334155" font-size="12"><tspan fill="#2563eb" font-weight="600">UK</tspan>  slug : varchar(100)</text>
    <text x="15" y="126" fill="#334155" font-size="12">    folder_path : varchar(255)</text>
    <text x="15" y="148" fill="#334155" font-size="12">    git_branch : varchar(50)</text>
    <text x="15" y="170" fill="#334155" font-size="12">    current_version : varchar(30)</text>
    <text x="15" y="192" fill="#334155" font-size="12">    current_commit : varchar(40)</text>
    <text x="15" y="214" fill="#334155" font-size="12">    maintenance_mode : boolean (0/1)</text>
    <text x="15" y="236" fill="#334155" font-size="12">    status : enum('active','inactive')</text>
  </g>

  <!-- TABLE 2: USERS (SSO Superadmin / Operator) -->
  <g transform="translate(60, 440)" filter="url(#shadow)">
    <rect width="320" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="#1e293b"/>
    <rect y="32" width="320" height="8" fill="#1e293b"/>
    <text x="160" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">USERS (SSO Identity)</text>
    <text x="15" y="60" fill="#0f172a" font-size="12"><tspan fill="#d97706" font-weight="700">PK</tspan>  id : bigint unsigned</text>
    <text x="15" y="82" fill="#334155" font-size="12">    name : varchar(255)</text>
    <text x="15" y="104" fill="#334155" font-size="12"><tspan fill="#2563eb" font-weight="600">UK</tspan>  username : varchar(100)</text>
    <text x="15" y="126" fill="#334155" font-size="12">    role : enum('superadmin',...)</text>
    <text x="15" y="148" fill="#334155" font-size="12">    email : varchar(255)</text>
  </g>

  <!-- TABLE 3: APPLICATION_RELEASES (Version Catalog) -->
  <g transform="translate(450, 130)" filter="url(#shadow)">
    <rect width="320" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="url(#headerGrad)"/>
    <rect y="32" width="320" height="8" fill="#0c306b"/>
    <text x="160" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">APPLICATION_RELEASES</text>
    <text x="15" y="60" fill="#0f172a" font-size="12"><tspan fill="#d97706" font-weight="700">PK</tspan>  id : bigint unsigned</text>
    <text x="15" y="82" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  application_id : bigint unsigned</text>
    <text x="15" y="104" fill="#334155" font-size="12">    version_tag : varchar(50) (e.g. v2.1.0)</text>
    <text x="15" y="126" fill="#334155" font-size="12">    commit_hash : varchar(40)</text>
    <text x="15" y="148" fill="#334155" font-size="12">    git_tag : varchar(100)</text>
    <text x="15" y="170" fill="#334155" font-size="12">    changelog_summary : text</text>
    <text x="15" y="192" fill="#334155" font-size="12">    is_stable_release : boolean</text>
    <text x="15" y="214" fill="#334155" font-size="12">    released_at : timestamp</text>
  </g>

  <!-- TABLE 4: APPLICATION_DEPLOYMENTS (Execution Runs) -->
  <g transform="translate(840, 130)" filter="url(#shadow)">
    <rect width="320" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="url(#headerGrad)"/>
    <rect y="32" width="320" height="8" fill="#0c306b"/>
    <text x="160" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">APPLICATION_DEPLOYMENTS</text>
    <text x="15" y="60" fill="#0f172a" font-size="12"><tspan fill="#d97706" font-weight="700">PK</tspan>  id : bigint unsigned</text>
    <text x="15" y="82" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  application_id : bigint unsigned</text>
    <text x="15" y="104" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  target_release_id : bigint unsigned</text>
    <text x="15" y="126" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  initiated_by : bigint unsigned</text>
    <text x="15" y="148" fill="#334155" font-size="12">    action_type : enum('update','downgrade')</text>
    <text x="15" y="170" fill="#334155" font-size="12">    from_commit : varchar(40)</text>
    <text x="15" y="192" fill="#334155" font-size="12">    to_commit : varchar(40)</text>
    <text x="15" y="214" fill="#334155" font-size="12">    status : enum('running','success','failed')</text>
    <text x="15" y="236" fill="#334155" font-size="12">    execution_logs : longtext</text>
    <text x="15" y="258" fill="#334155" font-size="12">    duration_seconds : int</text>
  </g>

  <!-- TABLE 5: APPLICATION_BACKUPS (Snapshots Before Update) -->
  <g transform="translate(840, 460)" filter="url(#shadow)">
    <rect width="320" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="url(#goldGrad)"/>
    <rect y="32" width="320" height="8" fill="#d97706"/>
    <text x="160" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">APPLICATION_BACKUPS</text>
    <text x="15" y="60" fill="#0f172a" font-size="12"><tspan fill="#d97706" font-weight="700">PK</tspan>  id : bigint unsigned</text>
    <text x="15" y="82" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  application_id : bigint unsigned</text>
    <text x="15" y="104" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  deployment_id : bigint unsigned</text>
    <text x="15" y="126" fill="#334155" font-size="12">    backup_name : varchar(255)</text>
    <text x="15" y="148" fill="#334155" font-size="12">    db_snapshot_file : varchar(255)</text>
    <text x="15" y="170" fill="#334155" font-size="12">    file_size_mb : decimal(10,2)</text>
    <text x="15" y="192" fill="#334155" font-size="12">    checksum_sha256 : varchar(64)</text>
    <text x="15" y="214" fill="#334155" font-size="12">    created_at : timestamp</text>
  </g>

  <!-- TABLE 6: MAINTENANCE_EVENTS (Maintenance Mode History) -->
  <g transform="translate(450, 460)" filter="url(#shadow)">
    <rect width="320" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="#059669"/>
    <rect y="32" width="320" height="8" fill="#059669"/>
    <text x="160" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">MAINTENANCE_EVENTS</text>
    <text x="15" y="60" fill="#0f172a" font-size="12"><tspan fill="#d97706" font-weight="700">PK</tspan>  id : bigint unsigned</text>
    <text x="15" y="82" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  application_id : bigint unsigned</text>
    <text x="15" y="104" fill="#334155" font-size="12"><tspan fill="#059669" font-weight="600">FK</tspan>  triggered_by : bigint unsigned</text>
    <text x="15" y="126" fill="#334155" font-size="12">    event_type : enum('enter_down','exit_up')</text>
    <text x="15" y="148" fill="#334155" font-size="12">    public_message : varchar(500)</text>
    <text x="15" y="170" fill="#334155" font-size="12">    bypass_secret_hash : varchar(255)</text>
    <text x="15" y="192" fill="#334155" font-size="12">    client_ip : varchar(45)</text>
    <text x="15" y="214" fill="#334155" font-size="12">    recorded_at : timestamp</text>
  </g>

  <!-- Connectors with Labels -->
  <!-- APPLICATIONS -> APPLICATION_RELEASES (1:N) -->
  <path d="M 380 230 L 450 230" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#oneOnly)" marker-end="url(#crowFoot)"/>
  <text x="415" y="220" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">1:N</text>

  <!-- APPLICATIONS -> APPLICATION_DEPLOYMENTS (1:N) -->
  <path d="M 380 200 Q 610 80 840 200" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4" marker-start="url(#oneOnly)" marker-end="url(#crowFoot)"/>
  <text x="610" y="120" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">1:N (Deployments)</text>

  <!-- APPLICATION_RELEASES -> APPLICATION_DEPLOYMENTS (1:N) -->
  <path d="M 770 230 L 840 230" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#oneOnly)" marker-end="url(#crowFoot)"/>
  <text x="805" y="220" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600">1:N</text>

  <!-- APPLICATION_DEPLOYMENTS -> APPLICATION_BACKUPS (1:1 / 1:N) -->
  <path d="M 1000 410 L 1000 460" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#oneOnly)" marker-end="url(#crowFoot)"/>
  <text x="1015" y="440" fill="#64748b" font-size="10" font-weight="600">1:N</text>

  <!-- APPLICATIONS -> MAINTENANCE_EVENTS (1:N) -->
  <path d="M 220 390 L 220 530 L 450 530" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#oneOnly)" marker-end="url(#crowFoot)"/>
  <text x="320" y="520" fill="#64748b" font-size="10" font-weight="600">1:N (Maintenance)</text>

  <!-- USERS -> APPLICATION_DEPLOYMENTS -->
  <path d="M 380 500 Q 610 500 840 370" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#crowFoot)"/>

  <!-- Footer Info -->
  <rect x="40" y="730" width="1120" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="758" fill="#64748b" font-size="12">KPKNL Palembang &bull; Arsitektur Basis Data Modul Central Application Maintenance &amp; Downgrading Orchestrator (SSO Engine)</text>
  <text x="1140" y="758" text-anchor="end" fill="#059669" font-size="12" font-weight="600">&#x2714; Enterprise Schema Validated</text>
</svg>
