<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle: Midnight Navy to Deep Classic Blue -->
    <linearGradient id="lelang-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Risalah Document: Crisp White -->
    <linearGradient id="lelang-doc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <!-- Palu Lelang (Gavel Head): Deep Blue & Cobalt -->
    <linearGradient id="lelang-gavel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Palu Lelang (Handle): Clean Ice White to Pale Blue -->
    <linearGradient id="lelang-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="lelang-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#061224" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#lelang-bg)" filter="url(#lelang-shadow)"/>
  
  <!-- Subtle Glow Accent -->
  <circle cx="96" cy="32" r="28" fill="#ffffff" opacity="0.10"/>

  <!-- Legal Document / Risalah Folder (Crisp White) -->
  <rect x="22" y="24" width="62" height="78" rx="8" fill="url(#lelang-doc)"/>
  <path d="M68 24 L84 40 L68 40 Z" fill="#bfdbfe"/>

  <!-- Document Text Lines (Blue Gradient Accents) -->
  <rect x="30" y="36" width="30" height="4" rx="2" fill="#1d4ed8"/>
  <rect x="30" y="46" width="46" height="3.5" rx="1.75" fill="#60a5fa" opacity="0.8"/>
  <rect x="30" y="54" width="42" height="3.5" rx="1.75" fill="#60a5fa" opacity="0.8"/>
  <rect x="30" y="62" width="36" height="3.5" rx="1.75" fill="#93c5fd" opacity="0.8"/>

  <!-- Official KPKNL Blue Seal Stamp on Document -->
  <circle cx="40" cy="80" r="8.5" fill="#1d4ed8"/>
  <circle cx="40" cy="80" r="6" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.8"/>
  <circle cx="40" cy="80" r="2.5" fill="#ffffff"/>

  <!-- Auction Gavel (Palu Lelang) in Blue & Chrome White -->
  <g transform="rotate(-32 75 75)">
    <!-- Gavel Head -->
    <rect x="62" y="34" width="32" height="16" rx="5" fill="url(#lelang-gavel)" filter="url(#lelang-shadow)"/>
    <rect x="58" y="32" width="6" height="20" rx="3" fill="#0b2559"/>
    <rect x="92" y="32" width="6" height="20" rx="3" fill="#0b2559"/>
    <!-- Gavel Handle (White & Blue Rim) -->
    <rect x="74" y="50" width="8" height="46" rx="4" fill="url(#lelang-handle)"/>
    <rect x="74" y="86" width="8" height="14" rx="4" fill="#1d4ed8"/>
  </g>

  <!-- Gavel Base Block (Navy Shadow) -->
  <ellipse cx="88" cy="98" rx="20" ry="7" fill="#0b2559" opacity="0.6"/>
</svg>
