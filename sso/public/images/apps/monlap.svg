<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle: Deep Royal Navy to Kemenkeu Blue -->
    <linearGradient id="monlap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2559"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Sheet: Crisp White with Ice Blue tint -->
    <linearGradient id="monlap-sheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <!-- Clip: Vibrant Sky/Cobalt Blue -->
    <linearGradient id="monlap-clip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Subtle Drop Shadow -->
    <filter id="monlap-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#071b40" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#monlap-bg)" filter="url(#monlap-shadow)"/>
  
  <!-- Subtle White Grid Glow -->
  <circle cx="96" cy="32" r="28" fill="#ffffff" opacity="0.10"/>

  <!-- Checklist Clipboard Sheet -->
  <rect x="26" y="24" width="76" height="84" rx="12" fill="url(#monlap-sheet)"/>

  <!-- Clipboard Top Clip (Blue & White) -->
  <rect x="46" y="16" width="36" height="16" rx="6" fill="url(#monlap-clip)"/>
  <rect x="54" y="20" width="20" height="6" rx="3" fill="#ffffff" opacity="0.85"/>

  <!-- Task 1: Blue Checkbox & Lines -->
  <circle cx="42" cy="46" r="7" fill="#1d4ed8"/>
  <path d="M38 46 l3 3 l5 -6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="54" y="43" width="36" height="6" rx="3" fill="#2563eb" opacity="0.9"/>

  <!-- Task 2: Blue Checkbox & Lines -->
  <circle cx="42" cy="64" r="7" fill="#1d4ed8"/>
  <path d="M38 64 l3 3 l5 -6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="54" y="61" width="30" height="6" rx="3" fill="#3b82f6" opacity="0.85"/>

  <!-- Task 3: Sky Blue In-Progress Dot & Line -->
  <circle cx="42" cy="82" r="7" fill="#38bdf8"/>
  <circle cx="42" cy="82" r="2.5" fill="#ffffff"/>
  <rect x="54" y="79" width="40" height="6" rx="3" fill="#93c5fd"/>

  <!-- Reporting Mini Trend Pill (Ice Blue & Royal Blue) -->
  <rect x="36" y="94" width="56" height="8" rx="4" fill="#dbeafe"/>
  <rect x="36" y="94" width="42" height="8" rx="4" fill="#1d4ed8"/>
</svg>
