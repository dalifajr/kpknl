<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="100%" height="100%" style="background:#f8fafc; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c306b" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c306b"/>
      <stop offset="100%" stop-color="#071f45"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1120" height="70" rx="12" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="40" y="92" width="1120" height="3" fill="#f59e0b"/>
  <text x="65" y="60" fill="#ffffff" font-size="20" font-weight="700">USE CASE DIAGRAM - SISTEM PEMINJAMAN RISALAH LELANG</text>
  <text x="65" y="80" fill="#94a3b8" font-size="12">KPKNL Palembang &bull; 4 Aktor Utama (Superadmin SSO, Admin Seksi HI, Pejabat Lelang, Peminjam Berkas)</text>

  <!-- SYSTEM BOUNDARY BOX -->
  <rect x="330" y="125" width="540" height="760" rx="16" fill="#ffffff" stroke="#0c306b" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <rect x="330" y="125" width="540" height="40" rx="16" fill="#f1f5f9"/>
  <rect x="330" y="150" width="540" height="15" fill="#f1f5f9"/>
  <text x="600" y="150" fill="#0c306b" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">BOUNDARY: SISTEM PEMINJAMAN RISALAH LELANG KPKNL PALEMBANG</text>

  <!-- ACTOR 1: SUPERADMIN (TOP LEFT) -->
  <g transform="translate(80, 150)">
    <!-- Stick Figure -->
    <circle cx="50" cy="30" r="18" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
    <path d="M 50 48 L 50 100 M 20 68 L 80 68 M 50 100 L 25 145 M 50 100 L 75 145" fill="none" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-10" y="155" width="120" height="44" rx="8" fill="#4338ca" filter="url(#shadow)"/>
    <text x="50" y="173" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">SUPERADMIN</text>
    <text x="50" y="188" fill="#e0e7ff" font-size="9.5" text-anchor="middle">(Portal SSO Terpusat)</text>
  </g>

  <!-- ACTOR 2: ADMIN SEKSI HI (BOTTOM LEFT) -->
  <g transform="translate(80, 480)">
    <circle cx="50" cy="30" r="18" fill="#dbeafe" stroke="#0c306b" stroke-width="2.5"/>
    <path d="M 50 48 L 50 100 M 20 68 L 80 68 M 50 100 L 25 145 M 50 100 L 75 145" fill="none" stroke="#0c306b" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-15" y="155" width="130" height="44" rx="8" fill="#0c306b" filter="url(#shadow)"/>
    <text x="50" y="173" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">ADMIN SEKSI HI</text>
    <text x="50" y="188" fill="#94a3b8" font-size="9.5" text-anchor="middle">(Administrator Arsip)</text>
  </g>

  <!-- ACTOR 3: PELELANG (TOP RIGHT) -->
  <g transform="translate(1000, 150)">
    <circle cx="50" cy="30" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
    <path d="M 50 48 L 50 100 M 20 68 L 80 68 M 50 100 L 25 145 M 50 100 L 75 145" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-10" y="155" width="120" height="44" rx="8" fill="#b45309" filter="url(#shadow)"/>
    <text x="50" y="173" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PELELANG</text>
    <text x="50" y="188" fill="#fef3c7" font-size="9.5" text-anchor="middle">(Pejabat Lelang)</text>
  </g>

  <!-- ACTOR 4: PEMINJAM (BOTTOM RIGHT) -->
  <g transform="translate(1000, 480)">
    <circle cx="50" cy="30" r="18" fill="#dcfce7" stroke="#047857" stroke-width="2.5"/>
    <path d="M 50 48 L 50 100 M 20 68 L 80 68 M 50 100 L 25 145 M 50 100 L 75 145" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-10" y="155" width="120" height="44" rx="8" fill="#047857" filter="url(#shadow)"/>
    <text x="50" y="173" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PEMINJAM</text>
    <text x="50" y="188" fill="#dcfce7" font-size="9.5" text-anchor="middle">(Pegawai Internal)</text>
  </g>

  <!-- USE CASES (ELLIPSES) INSIDE BOUNDARY -->
  <!-- UC 1: SSO Authentication -->
  <g transform="translate(430, 180)" filter="url(#shadow)">
    <ellipse cx="170" cy="24" rx="160" ry="24" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
    <text x="170" y="28" fill="#1e1b4b" font-size="11.5" font-weight="600" text-anchor="middle">UC-01: Single Sign-On (SSO) &amp; Role Check</text>
  </g>

  <!-- UC 2: Assign Specific Roles (Superadmin) -->
  <g transform="translate(370, 245)" filter="url(#shadow)">
    <ellipse cx="160" cy="24" rx="150" ry="24" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="160" y="28" fill="#312e81" font-size="11" font-weight="700" text-anchor="middle">UC-02: Assign Role (admin/pelelang/peminjam)</text>
  </g>

  <!-- UC 3: Pendaftaran Risalah Baru -->
  <g transform="translate(560, 245)" filter="url(#shadow)">
    <ellipse cx="150" cy="24" rx="140" ry="24" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="150" y="28" fill="#78350f" font-size="11" font-weight="600" text-anchor="middle">UC-03: Daftarkan Risalah (Minuta/TAP/Batal)</text>
  </g>

  <!-- UC 4: Validasi & Penentuan Lemari/Box -->
  <g transform="translate(360, 315)" filter="url(#shadow)">
    <ellipse cx="170" cy="24" rx="160" ry="24" fill="#eff6ff" stroke="#0c306b" stroke-width="2"/>
    <text x="170" y="28" fill="#0c306b" font-size="11" font-weight="700" text-anchor="middle">UC-04: Validasi Risalah &amp; Assign Lemari/Box</text>
  </g>

  <!-- UC 5: Catatan Revisi Risalah -->
  <g transform="translate(560, 385)" filter="url(#shadow)">
    <ellipse cx="150" cy="24" rx="140" ry="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="28" fill="#991b1b" font-size="11" font-weight="600" text-anchor="middle">UC-05: Review Catatan &amp; Resubmit Revisi</text>
  </g>

  <!-- UC 6: Jelajah & Cari Katalog Risalah -->
  <g transform="translate(420, 460)" filter="url(#shadow)">
    <ellipse cx="180" cy="24" rx="170" ry="24" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="180" y="28" fill="#0369a1" font-size="11.5" font-weight="600" text-anchor="middle">UC-06: Cari Katalog Risalah (10.483 Berkas)</text>
  </g>

  <!-- UC 7: Multi-Item Cart & Permohonan Pinjam -->
  <g transform="translate(490, 530)" filter="url(#shadow)">
    <ellipse cx="180" cy="24" rx="170" ry="24" fill="#dcfce7" stroke="#047857" stroke-width="2"/>
    <text x="180" y="28" fill="#064e3b" font-size="11" font-weight="700" text-anchor="middle">UC-07: Ajukan Multi-Item Peminjaman Berkas</text>
  </g>

  <!-- UC 8: Persetujuan Peminjaman (Admin) -->
  <g transform="translate(360, 600)" filter="url(#shadow)">
    <ellipse cx="160" cy="24" rx="150" ry="24" fill="#eff6ff" stroke="#0c306b" stroke-width="2"/>
    <text x="160" y="28" fill="#0c306b" font-size="11" font-weight="700" text-anchor="middle">UC-08: Setujui Permohonan Peminjaman</text>
  </g>

  <!-- UC 9: Konfirmasi Penerimaan Fisik -->
  <g transform="translate(540, 670)" filter="url(#shadow)">
    <ellipse cx="160" cy="24" rx="150" ry="24" fill="#dcfce7" stroke="#047857" stroke-width="2"/>
    <text x="160" y="28" fill="#064e3b" font-size="11" font-weight="600" text-anchor="middle">UC-09: Konfirmasi Pengambilan Fisik</text>
  </g>

  <!-- UC 10: Pengajuan & Verifikasi Pengembalian -->
  <g transform="translate(430, 745)" filter="url(#shadow)">
    <ellipse cx="180" cy="26" rx="175" ry="26" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="180" y="26" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">UC-10: Ajukan Pengembalian Berkas</text>
    <text x="180" y="42" fill="#78350f" font-size="9.5" text-anchor="middle">&amp; Verifikasi Fisik Kembali ke Tersedia</text>
  </g>

  <!-- UC 11: Monitoring KPI & Overdue -->
  <g transform="translate(360, 815)" filter="url(#shadow)">
    <ellipse cx="160" cy="24" rx="150" ry="24" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="160" y="28" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">UC-11: Monitoring Executive KPI &amp; Overdue</text>
  </g>

  <!-- ASSOCIATION LINES -->
  <!-- Superadmin to UC-01 & UC-02 -->
  <line x1="170" y1="180" x2="435" y2="198" stroke="#4338ca" stroke-width="1.8"/>
  <line x1="170" y1="190" x2="375" y2="260" stroke="#4338ca" stroke-width="1.8"/>

  <!-- Admin to UC-01, UC-04, UC-05, UC-08, UC-10, UC-11 -->
  <line x1="185" y1="520" x2="435" y2="208" stroke="#0c306b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="185" y1="530" x2="365" y2="340" stroke="#0c306b" stroke-width="2"/>
  <line x1="185" y1="540" x2="570" y2="400" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="185" y1="550" x2="370" y2="615" stroke="#0c306b" stroke-width="2"/>
  <line x1="185" y1="560" x2="445" y2="760" stroke="#0c306b" stroke-width="2"/>
  <line x1="185" y1="570" x2="370" y2="830" stroke="#0c306b" stroke-width="2"/>

  <!-- Pelelang to UC-01, UC-03, UC-05, UC-06 -->
  <line x1="990" y1="180" x2="740" y2="198" stroke="#b45309" stroke-width="1.5"/>
  <line x1="990" y1="195" x2="840" y2="260" stroke="#b45309" stroke-width="2"/>
  <line x1="990" y1="210" x2="840" y2="400" stroke="#b45309" stroke-width="2"/>
  <line x1="990" y1="225" x2="760" y2="475" stroke="#b45309" stroke-width="1.5"/>

  <!-- Peminjam to UC-01, UC-06, UC-07, UC-09, UC-10 -->
  <line x1="990" y1="520" x2="750" y2="210" stroke="#047857" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="990" y1="530" x2="770" y2="480" stroke="#047857" stroke-width="2"/>
  <line x1="990" y1="545" x2="835" y2="550" stroke="#047857" stroke-width="2"/>
  <line x1="990" y1="560" x2="840" y2="685" stroke="#047857" stroke-width="2"/>
  <line x1="990" y1="575" x2="775" y2="765" stroke="#047857" stroke-width="2"/>
</svg>
