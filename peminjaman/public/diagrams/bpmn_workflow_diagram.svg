<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 960" width="100%" height="100%" style="background:#f8fafc; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c306b" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c306b"/>
      <stop offset="100%" stop-color="#071f45"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1220" height="70" rx="12" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="40" y="92" width="1220" height="3" fill="#f59e0b"/>
  <text x="65" y="60" fill="#ffffff" font-size="20" font-weight="700">BUSINESS PROCESS MODEL AND NOTATION (BPMN 2.0)</text>
  <text x="65" y="80" fill="#94a3b8" font-size="12">Alur Tata Kelola Pendaftaran Risalah Lelang &amp; Siklus 5 Tahapan Peminjaman Berkas Fisik</text>

  <!-- SWIMLANE CONTAINER -->
  <rect x="40" y="120" width="1220" height="810" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <!-- LANE 1: PEJABAT LELANG (Y: 120 to 300, H: 180) -->
  <rect x="40" y="120" width="60" height="190" fill="#fef3c7" rx="12 0 0 0"/>
  <text x="-215" y="75" fill="#92400e" font-size="12" font-weight="800" transform="rotate(-90)" text-anchor="middle">PEJABAT LELANG</text>
  <line x1="100" y1="120" x2="100" y2="930" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="310" x2="1260" y2="310" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LANE 2: ADMIN SEKSI HI (Y: 310 to 520, H: 210) -->
  <rect x="40" y="310" width="60" height="210" fill="#eff6ff"/>
  <text x="-415" y="75" fill="#1e3a8a" font-size="12" font-weight="800" transform="rotate(-90)" text-anchor="middle">ADMIN SEKSI HI</text>
  <line x1="40" y1="520" x2="1260" y2="520" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LANE 3: PEMINJAM BERKAS (Y: 520 to 730, H: 210) -->
  <rect x="40" y="520" width="60" height="210" fill="#f0fdf4"/>
  <text x="-625" y="75" fill="#14532d" font-size="12" font-weight="800" transform="rotate(-90)" text-anchor="middle">PEMINJAM (PEGAWAI)</text>
  <line x1="40" y1="730" x2="1260" y2="730" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LANE 4: SISTEM & DATABASE (Y: 730 to 930, H: 200) -->
  <rect x="40" y="730" width="60" height="200" fill="#faf5ff" rx="0 0 0 12"/>
  <text x="-830" y="75" fill="#581c87" font-size="12" font-weight="800" transform="rotate(-90)" text-anchor="middle">DATABASE &amp; ENGINE</text>

  <!-- WORKFLOW ELEMENTS -->

  <!-- START EVENT (LANE 1) -->
  <circle cx="140" cy="180" r="18" fill="#10b981" stroke="#065f46" stroke-width="2.5"/>
  <text x="140" y="215" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">Risalah Selesai</text>

  <!-- TASK 1 (LANE 1): Input Risalah Baru -->
  <rect x="195" y="155" width="130" height="50" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="260" y="177" fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle">Input Risalah Baru</text>
  <text x="260" y="193" fill="#64748b" font-size="9" text-anchor="middle">Minuta / TAP / Batal</text>

  <!-- TASK 2 (LANE 4): Simpan ke Risalah Pending -->
  <rect x="195" y="760" width="130" height="50" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="260" y="782" fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle">Simpan Pending</text>
  <text x="260" y="798" fill="#64748b" font-size="9" text-anchor="middle">Status: belum_validasi</text>

  <!-- TASK 3 (LANE 2): Periksa Berkas & Fisik -->
  <rect x="365" y="355" width="130" height="50" rx="8" fill="#ffffff" stroke="#0c306b" stroke-width="1.5"/>
  <text x="430" y="377" fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle">Pemeriksaan Fisik</text>
  <text x="430" y="393" fill="#64748b" font-size="9" text-anchor="middle">Kesesuaian Dokumen</text>

  <!-- GATEWAY 1 (LANE 2): Valid or Revisi -->
  <polygon points="535,380 560,355 585,380 560,405" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="560" y="384" fill="#b45309" font-size="11" font-weight="800" text-anchor="middle">?</text>

  <!-- TASK 4A (LANE 1): Revisi Berkas -->
  <rect x="495" y="155" width="130" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="177" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">Revisi &amp; Resubmit</text>
  <text x="560" y="193" fill="#7f1d1d" font-size="9" text-anchor="middle">Ikuti Catatan Seksi HI</text>

  <!-- TASK 4B (LANE 2): Tetapkan Lemari & Box -->
  <rect x="625" y="355" width="140" height="50" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="695" y="377" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">Assign Lemari &amp; Box</text>
  <text x="695" y="393" fill="#047857" font-size="9" text-anchor="middle">Katalog: Tersedia</text>

  <!-- TASK 5 (LANE 3): Cari & Pilih Multi-Item (Cart) -->
  <rect x="625" y="555" width="140" height="50" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="695" y="577" fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle">Pilih Berkas Tersedia</text>
  <text x="695" y="593" fill="#64748b" font-size="9" text-anchor="middle">Checklist Multi-Item Cart</text>

  <!-- TASK 6 (LANE 3): Ajukan Peminjaman -->
  <rect x="800" y="555" width="130" height="50" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="865" y="577" fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle">Kirim Permohonan</text>
  <text x="865" y="593" fill="#64748b" font-size="9" text-anchor="middle">Stage 1: Proses Peminjaman</text>

  <!-- TASK 7 (LANE 2): Persetujuan Admin Seksi HI -->
  <rect x="800" y="355" width="130" height="50" rx="8" fill="#eff6ff" stroke="#0c306b" stroke-width="1.5"/>
  <text x="865" y="377" fill="#1e3a8a" font-size="10" font-weight="700" text-anchor="middle">Setujui Permohonan</text>
  <text x="865" y="393" fill="#1e40af" font-size="9" text-anchor="middle">Stage 2: Menunggu Ambil</text>

  <!-- TASK 8 (LANE 3): Konfirmasi Penerimaan Fisik -->
  <rect x="965" y="555" width="130" height="50" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="1030" y="577" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">Konfirmasi Terima</text>
  <text x="1030" y="593" fill="#047857" font-size="9" text-anchor="middle">Stage 3: Sedang Dipinjam</text>

  <!-- TASK 9 (LANE 3): Ajukan Pengembalian -->
  <rect x="965" y="640" width="130" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1030" y="662" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">Ajukan Pengembalian</text>
  <text x="1030" y="678" fill="#78350f" font-size="9" text-anchor="middle">Stage 4: Proses Kembali</text>

  <!-- TASK 10 (LANE 2): Verifikasi Fisik Pengembalian -->
  <rect x="1115" y="355" width="130" height="50" rx="8" fill="#ffffff" stroke="#0c306b" stroke-width="1.5"/>
  <text x="1180" y="377" fill="#1e293b" font-size="10" font-weight="700" text-anchor="middle">Verifikasi Fisik</text>
  <text x="1180" y="393" fill="#64748b" font-size="9" text-anchor="middle">Cek Keutuhan &amp; Box</text>

  <!-- TASK 11 (LANE 4): Restore Status Katalog ke Tersedia -->
  <rect x="1115" y="760" width="130" height="50" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="782" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">Restore ke Tersedia</text>
  <text x="1180" y="798" fill="#047857" font-size="9" text-anchor="middle">Stage 5: Sudah Kembali</text>

  <!-- END EVENT (LANE 4) -->
  <circle cx="1180" cy="880" r="18" fill="#ffffff" stroke="#ef4444" stroke-width="4"/>
  <text x="1180" y="915" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">Siklus Selesai</text>

  <!-- CONNECTING FLOW ARROWS -->
  <!-- Start to Task 1 -->
  <line x1="158" y1="180" x2="195" y2="180" stroke="#0c306b" stroke-width="1.5"/>
  <!-- Task 1 to Task 2 (Down to Lane 4) -->
  <path d="M 260 205 L 260 760" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Task 2 to Task 3 (Up to Lane 2) -->
  <path d="M 325 785 L 430 785 L 430 405" fill="none" stroke="#0c306b" stroke-width="1.5"/>
  <!-- Task 3 to Gateway 1 -->
  <line x1="495" y1="380" x2="535" y2="380" stroke="#0c306b" stroke-width="1.5"/>
  <!-- Gateway 1 to Task 4A (Revisi Up) -->
  <path d="M 560 355 L 560 205" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="568" y="270" fill="#dc2626" font-size="9" font-weight="700">Revisi</text>
  <!-- Task 4A back to Task 3 -->
  <path d="M 495 180 L 430 180 L 430 355" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Gateway 1 to Task 4B (Valid Right) -->
  <line x1="585" y1="380" x2="625" y2="380" stroke="#059669" stroke-width="1.5"/>
  <text x="595" y="372" fill="#059669" font-size="9" font-weight="700">Valid</text>
  <!-- Task 4B down to Task 5 -->
  <line x1="695" y1="405" x2="695" y2="555" stroke="#059669" stroke-width="1.5"/>
  <!-- Task 5 to Task 6 -->
  <line x1="765" y1="580" x2="800" y2="580" stroke="#047857" stroke-width="1.5"/>
  <!-- Task 6 up to Task 7 (Approval) -->
  <line x1="865" y1="555" x2="865" y2="405" stroke="#0c306b" stroke-width="1.5"/>
  <!-- Task 7 down to Task 8 (Fisik Handover) -->
  <path d="M 930 380 L 980 380 L 980 555" fill="none" stroke="#059669" stroke-width="1.5"/>
  <!-- Task 8 down to Task 9 (Pengembalian) -->
  <line x1="1030" y1="605" x2="1030" y2="640" stroke="#d97706" stroke-width="1.5"/>
  <!-- Task 9 up to Task 10 (Verify Return) -->
  <path d="M 1095 665 L 1180 665 L 1180 405" fill="none" stroke="#0c306b" stroke-width="1.5"/>
  <!-- Task 10 down to Task 11 (Database Restore) -->
  <line x1="1180" y1="405" x2="1180" y2="760" stroke="#059669" stroke-width="2"/>
  <!-- Task 11 down to End -->
  <line x1="1180" y1="810" x2="1180" y2="862" stroke="#ef4444" stroke-width="2"/>
</svg>
