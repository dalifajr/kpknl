<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>PAYO ARSIP</title>
  <style>
    body {
      background-color: #d9f0fa;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #0c4a6e;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .container img {
      width: 130px;
      margin-bottom: 15px;
    }

    h1 {
      color: #fff;
      font-size: 22px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
    }

    input::placeholder {
      color: #666;
      font-weight: bold;
    }

    button {
      background-color: #0369a1;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #075985;
    }

    .bottom-text {
      margin-top: 15px;
      font-size: 13px;
      color: #fff;
    }

    .bottom-text a {
      color: #ffdc73;
      font-weight: bold;
      text-decoration: none;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .message {
      font-size: 13px;
      margin-top: 8px;
    }
    .message.error { color: #ff5c5c; }
    .message.success { color: #4ade80; }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.png" alt="Logo">
    <h1>Daftar</h1>

    <form id="registerForm" method="POST" action="register.php">
  <input type="text" name="username" placeholder="Username" required>
  <input type="text" name="email" placeholder="NIP" required>
  <input type="password" name="password" placeholder="Password" required>
  <input type="password" name="confirm" placeholder="Masukkan Ulang Password" required>
  <input type="hidden" name="role" value="peminjam"> <!-- Role default -->
  <button type="submit">Daftar</button>
  <div id="message" class="message"></div>
</form>


    <p class="bottom-text">
      Sudah punya akun? <a href="index.html">Masuk</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      const pass = document.querySelector('[name="password"]').value;
      const confirm = document.querySelector('[name="confirm"]').value;
      const message = document.getElementById('message');

      if (pass !== confirm) {
        e.preventDefault();
        message.textContent = "Password dan konfirmasi tidak cocok!";
        message.className = "message error";
      } else {
        message.textContent = "";
      }
    });
  </script>

</body>
</html>
