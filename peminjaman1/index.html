<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>PAYO ARSIP</title>
  <style>
    body {
      background-color: #d9f0fa;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #0c4a6e;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .container img {
      width: 130px;
      margin-bottom: 15px;
    }

    h1 {
      color: #fff;
      font-size: 22px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
    }

    input::placeholder {
      color: #666;
      font-weight: bold;
    }

    button {
      background-color: #0369a1;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #075985;
    }

    .bottom-text {
      margin-top: 15px;
      font-size: 13px;
      color: #fff;
    }

    .bottom-text a {
      color: #ffdc73;
      font-weight: bold;
      text-decoration: none;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.png" alt="Logo">
    <h1>Masuk</h1>

    <form action="login.php" method="POST">
  <input type="text" name="user_input" placeholder="NIP atau Username" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Masuk</button>
</form>

    <p class="bottom-text">
      Belum punya akun? <a href="register.html">Daftar</a>
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("register") === "success") {
        alert("Pendaftaran berhasil! Silakan login.");
    }
  </script>

</body>
</html>
